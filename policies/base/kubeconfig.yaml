apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: flux-tenant-kubeconfig
  annotations:
    policy.toolkit.fluxcd.io/description: |
      Deny Flux Kustomizations and HelmReleases that target a remote cluster
      via spec.kubeconfig in tenant namespaces.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:   ["kustomize.toolkit.fluxcd.io"]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["kustomizations"]
      - apiGroups:   ["helm.toolkit.fluxcd.io"]
        apiVersions: ["v2"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["helmreleases"]
  validations:
    - expression: "!has(object.spec.kubeconfig)"
      message: "spec.kubeconfig is not allowed in tenant namespaces"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: flux-tenant-kubeconfig
  annotations:
    policy.toolkit.fluxcd.io/description: |
      Bind the Flux remote cluster restriction policy to all tenant namespaces.
spec:
  policyName: flux-tenant-kubeconfig
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: toolkit.fluxcd.io/tenant
          operator: Exists
