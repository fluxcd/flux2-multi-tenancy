apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: flux-tenant-buckets
  annotations:
    policy.toolkit.fluxcd.io/description: |
      Deny Flux Bucket sources in tenant namespaces.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:   ["source.toolkit.fluxcd.io"]
        apiVersions: ["v1"]
        operations:  ["CREATE"]
        resources:   ["buckets"]
  validations:
    - expression: "false"
      message: "Bucket sources are not allowed in tenant namespaces"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: flux-tenant-buckets
  annotations:
    policy.toolkit.fluxcd.io/description: |
      Bind the Flux Bucket restriction policy to all tenant namespaces.
spec:
  policyName: flux-tenant-buckets
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: toolkit.fluxcd.io/tenant
          operator: Exists
